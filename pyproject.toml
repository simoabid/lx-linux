[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lx"
version = "0.1.0"
description = "lx — a modern, feature-rich CLI toolkit to power your Linux experience"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "seemoo"}]
keywords = ["linux", "cli", "system", "tweaks", "terminal", "admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/simoabid/lx-linux"
Repository = "https://github.com/simoabid/lx-linux"
Issues = "https://github.com/simoabid/lx-linux/issues"
Changelog = "https://github.com/simoabid/lx-linux/blob/main/CHANGELOG.md"

[project.scripts]
lx = "lx.__main__:main"

[tool.setuptools]
packages = ["lx", "lx.commands", "lx.utils"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501", "SIM105"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
