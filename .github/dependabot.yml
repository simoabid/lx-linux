version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      runtime-deps:
        patterns: ["rich", "psutil", "click"]
      dev-deps:
        patterns: ["pytest*", "ruff"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
